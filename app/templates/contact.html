{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">
{% endblock %}

{% block content %}

<h2>Admission Form</h2>

<form id="admissionForm">

    <input type="text" id="name" placeholder="Student Name"><br><br>
         <input type="email" id="email" placeholder="Email"><br><br>

    <input type="text" id="phone" placeholder="Phone"><br><br>

    
    <select id="board">
        <option value="">Select Board</option>
                 <option value="CBSE">CBSE</option>
        <option value="State">State</option>
    </select><br><br>


    <select id="location">
    <option value="">Select Location</option>
        <option value="Vizag">Vizag</option>
                <option value="Bangalore">Bangalore</option>
        <option value="Chennai">Chennai</option>
        <option value="Hyderabad">Hyderabad</option>
    </select><br><br>

    <textarea id="message" placeholder="Message"></textarea><br><br>

    <button type="submit">Submit</button>

</form>

<p id="responseMsg"></p>

<script src="{{ url_for('static', filename='js/contact.js') }}"></script>

{% endblock %}
